name: Feature request
description: Suggest an improvement or a new check.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What you'd like to be able to find or fix
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why it matters
      description: Who is affected and how.
  - type: textarea
    attributes:
      label: Anything else
